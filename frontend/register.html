<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Register — Farmova</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-5"><div class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl p-6 shadow-2xl"><div class="text-center mb-6"><div class="text-4xl">🌾</div><h1 class="text-2xl font-extrabold text-emerald-400 mt-2">Create Farmova Account</h1></div><form id="registerForm" class="space-y-3"><input id="name" required placeholder="Full name" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm"><input id="phone" required placeholder="Phone number" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm"><input id="password" type="password" required placeholder="Password" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm"><select id="role" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm"><option value="">Select role</option><option value="FARMER">Farmer</option><option value="BUYER">Buyer</option><option value="FPO">FPO</option></select><input id="location" placeholder="Location" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm"><input type="hidden" id="language" value="English"><button id="registerBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 rounded-lg text-sm">REGISTER</button><p id="registerStatus" class="text-xs text-center"></p></form><div class="flex justify-between mt-5 text-xs"><a href="login.html" class="text-emerald-400">Already have an account?</a><a href="index.html" class="text-slate-400">← Home</a></div></div><script src="api.js"></script><script src="auth.js"></script><script>
document.addEventListener("DOMContentLoaded",function(){const form=document.getElementById("registerForm"),status=document.getElementById("registerStatus"),btn=document.getElementById("registerBtn"),nameInput=document.getElementById("name"),phoneInput=document.getElementById("phone"),passwordInput=document.getElementById("password"),roleInput=document.getElementById("role"),locationInput=document.getElementById("location"),languageInput=document.getElementById("language");form.addEventListener("submit",async function(e){e.preventDefault();btn.disabled=true;status.textContent="Creating account...";try{const data=await apiPost("/auth/register",null,{name:nameInput.value.trim(),phone:phoneInput.value.trim(),password:passwordInput.value,role:roleInput.value,location:locationInput.value.trim(),language:languageInput.value});status.textContent=data.message||"Registered successfully. Redirecting to login...";status.className="text-xs text-center text-emerald-400";setTimeout(()=>window.location.href="login.html",900);}catch(err){status.textContent=err.message;status.className="text-xs text-center text-rose-400";}finally{btn.disabled=false;}});});
</script></body></html>
