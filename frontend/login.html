<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login — Farmova</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-5"><div class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl p-6 shadow-2xl"><div class="text-center mb-6"><div class="text-4xl">🌾</div><h1 class="text-2xl font-extrabold text-emerald-400 mt-2">Farmova Login</h1><p class="text-xs text-slate-400 mt-1">Sign in to access your marketplace features.</p></div><form id="loginForm" class="space-y-4"><div><label class="block text-xs font-semibold mb-1">Phone</label><input id="phone" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm"></div><div><label class="block text-xs font-semibold mb-1">Password</label><input id="password" type="password" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm"></div><button id="loginBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 rounded-lg text-sm">LOGIN</button><p id="loginStatus" class="text-xs text-center"></p></form><div class="flex justify-between mt-5 text-xs"><a href="register.html" class="text-emerald-400">Create account</a><a href="index.html" class="text-slate-400">← Home</a></div></div><script src="api.js"></script><script src="auth.js"></script></body></html>
