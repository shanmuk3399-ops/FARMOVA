<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Buyer Dashboard — Farmova</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="api.js"></script><script src="auth.js"></script></head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">
<header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-lg">
<div class="flex items-center gap-3"><span class="text-2xl">🛒</span><h1 class="text-xl font-bold text-emerald-400">Farmova Marketplace</h1></div>
<div class="flex gap-2"><a href="orders.html" class="text-xs text-emerald-400 bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-600">MY ORDERS</a><a href="index.html" class="text-xs text-slate-400 hover:text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg">← Back to Home</a></div>
</header>
<main class="flex-1 max-w-6xl mx-auto w-full p-6 flex flex-col gap-6">
<section class="bg-slate-800 rounded-xl border border-slate-700 p-4 shadow-xl flex flex-wrap gap-3 items-center justify-between">
<div class="flex-1 min-w-[220px]"><input id="searchInput" type="text" placeholder="🔍 Search crops..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500"></div>
<div class="flex gap-2 flex-wrap">
<select id="locationSelect" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100"></select>
<select id="sortSelect" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100">
<option value="price_asc">Sort by Price: Low to High</option>
<option value="price_desc">Sort by Price: High to Low</option>
<option value="qty_desc">Sort by Quantity: High to Low</option>
<option value="newest">Newest Listings</option>
</select>
</div>
</section>

<section id="marketplaceGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
<div class="col-span-full text-center py-12 text-slate-400 text-sm">Loading live crop listings from database...</div>
</section>
<section class="bg-slate-800 rounded-xl border border-slate-700 p-5 shadow-xl">
<div class="flex items-center justify-between gap-3 mb-3"><div><h2 class="text-md font-bold text-emerald-400">📦 Latest Bids & Orders</h2><p class="text-xs text-slate-400">Your bidding price and order actions.</p></div><a href="orders.html" class="text-xs text-emerald-400 border border-slate-600 bg-slate-700 px-3 py-1.5 rounded-lg">VIEW MY ORDERS</a></div>
<div id="buyerStatusList" class="grid grid-cols-1 md:grid-cols-2 gap-3"><div class="text-xs text-slate-500">Loading your bids and orders...</div></div>
</section>
</main>
<div id="detailsModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4 z-50">
<div class="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-lg max-h-[90vh] overflow-y-auto shadow-2xl">
<div class="flex justify-between items-center p-5 border-b border-slate-700"><h2 id="detailsTitle" class="text-lg font-bold text-emerald-400">Produce Details</h2><button id="closeDetailsBtn" class="text-slate-400 hover:text-white text-xl">×</button></div>
<div id="detailsContent" class="p-5"></div>
</div>
</div>
<div id="offerModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4 z-50">
<div class="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-lg max-h-[90vh] overflow-y-auto shadow-2xl">
<div class="flex justify-between items-center p-5 border-b border-slate-700"><h2 class="text-lg font-bold text-emerald-400">Make Bidding Offer</h2><button id="closeOfferBtn" class="text-slate-400 hover:text-white text-xl">×</button></div>
<form id="offerForm" class="p-5 space-y-4">
<p id="offerCropName" class="font-bold text-slate-100"></p>
<p id="offerCropInfo" class="text-xs text-slate-400"></p>
<div><label class="block text-xs font-semibold mb-1">Buyer Name</label><input id="buyerName" type="text" placeholder="e.g. ABC Foods Ltd." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs"></div>
<div><label class="block text-xs font-semibold mb-1">Offer Price per Quintal (₹)</label><input id="offerPrice" type="number" step="0.01" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs"></div>
<div><label class="block text-xs font-semibold mb-1">Quantity (Qtl)</label><input id="offerQuantity" type="number" step="0.01" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs"></div>
<p id="offerStatus" class="text-xs text-center"></p>
<button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 rounded-lg text-xs">SUBMIT BIDDING OFFER</button>
</form>
</div>
</div>
<script src="js/buyer.js?v=final7"></script>
</body>
</html>
